;単位はms
[Ethernet]
;Activation lineのPULLUP後、PassThruConnectコール(ETHERNET接続)までのディレイ時間
;ECU通信情報とセットで管理
ConnectEtherDelay=200
;PassThruLogicalConnect (IP4_LOGICAL接続時)のタイムアウト時間
;ECU通信情報とセットで管理
ConnectIPTimeout=10000
;Activation Lineの抵抗値を4700Ωに設定した後、車両側の電圧が変化するまでのウェイト時間
;ECU通信情報とセットで管理
ReadVoltageWaitPullUp=5
;TCPソケット切断からの復帰時、Activation Lineの抵抗値を-1(Open)した後、車両側の電圧が変化するまでのウェイト時間
;ECU通信情報とセットで管理
ReadVoltageWait=5
;Activation lineのPULLUP時、バッテリ電圧に対するActivationLineの電圧値の割合を判定する処理を、スキップするかのフラグ
VoltJudgeSkip=0
;PassThruLogicalDisconnect(TCP)実行後、ウェイト時間
DisconnectWaitTimeTcp=0
;PassThruLogicalDisconnect(UDP)実行後、ウェイト時間
DisconnectWaitTimeUdp=0
;PassThruLogicalDisconnect(IP4)実行後、ウェイト時間
DisconnectWaitTimeIp4=0
;PassThruDisconnect(Ethernet)実行後、ウェイト時間
DisconnectWaitTimeEther=0
;テスタ側ポート番号
;ECU通信情報とセットで管理
SourcePortNumberUDP=13400
SourcePortNumberTCP=49152
